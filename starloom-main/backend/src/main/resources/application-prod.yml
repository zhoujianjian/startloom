spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:starloom}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2c5b9fa2aa5f0a42}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 320
          max-wait: 3000ms
          max-idle: 16
          min-idle: 8
  
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 日志配置
logging:
  file:
    path: /app/logs
    name: /app/logs/starloom.log
  level:
    root: INFO
    com.starloom: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB

# LLM 多厂商配置 - 生产环境
llm:
  default-provider: deepseek
  load-balance: false
  fallback-enabled: true
  
  providers:
    # 阿里云 DashScope (通义千问官方API)
    dashscope:
      enabled: false
      url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      api-key: YOUR_DASHSCOPE_API_KEY
      model: qwen-plus
      timeout: 60
      priority: 1
    
    # ModelScope
    modelscope:
      enabled: false
      url: https://api-inference.modelscope.cn/v1/chat/completions
      api-key: 4005f439-8ddc-4e26-8876-51f6281e99af
      model: Qwen/Qwen2.5-72B-Instruct
      timeout: 60
      priority: 2
    
    # DeepSeek - 主力
    deepseek:
      enabled: true
      url: https://api.deepseek.com/v1/chat/completions
      api-key: sk-ea6d2510726144df9754c1155cd2433d
      model: deepseek-chat
      timeout: 120
      priority: 1
    
    # OpenAI GPT
    gpt:
      enabled: false
      url: https://api.openai.com/v1/chat/completions
      api-key: sk-dPdIN0I5Tor1ezj5uqukHtf2kP8hYDwSJJ5_9ikXE6T3BlbkFJJiEDyehM9kBfBDPhoAVAu_3v9Yz2RnLTP-MlL2PnQA
      model: gpt-4.1
      timeout: 60
      priority: 4

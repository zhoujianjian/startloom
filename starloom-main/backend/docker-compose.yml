version: '3.8'

services:
  starloom-backend:
    image: openjdk:17-jdk-slim
    container_name: starloom-backend
    restart: always
    network_mode: host
    volumes:
      - /opt/suanming/starloom-backend-1.0.0.jar:/app/app.jar:ro
      - /opt/suanming/logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
    command: >
      java
      -Xms512m
      -Xmx1024m
      -XX:+UseG1GC
      -XX:MaxGCPauseMillis=200
      -XX:+HeapDumpOnOutOfMemoryError
      -XX:HeapDumpPath=/app/logs/heapdump.hprof
      -Djava.security.egd=file:/dev/./urandom
      -Dfile.encoding=UTF-8
      -jar /app/app.jar
      --spring.profiles.active=prod

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:starloom}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2c5b9fa2aa5f0a42}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# LLM 多厂商配置 - 生产环境使用环境变量
llm:
  default-provider: ${LLM_DEFAULT_PROVIDER:qwen}
  load-balance: ${LLM_LOAD_BALANCE:true}
  fallback-enabled: true
  
  providers:
    qwen:
      enabled: ${LLM_QWEN_ENABLED:true}
      url: https://api-inference.modelscope.cn/v1/chat/completions
      api-key: ${LLM_QWEN_API_KEY:}
      model: ${LLM_QWEN_MODEL:Qwen/Qwen2.5-72B-Instruct}
      timeout: 60
      priority: 1
    
    qwen-vl:
      enabled: ${LLM_QWEN_VL_ENABLED:false}
      url: https://api-inference.modelscope.cn/v1/chat/completions
      api-key: ${LLM_QWEN_VL_API_KEY:}
      model: ${LLM_QWEN_VL_MODEL:Qwen/Qwen2.5-VL-72B-Instruct}
      timeout: 60
      priority: 2
    
    deepseek:
      enabled: ${LLM_DEEPSEEK_ENABLED:true}
      url: https://api.deepseek.com/v1/chat/completions
      api-key: ${LLM_DEEPSEEK_API_KEY:}
      model: ${LLM_DEEPSEEK_MODEL:deepseek-chat}
      timeout: 120
      priority: 3
    
    gpt:
      enabled: ${LLM_GPT_ENABLED:false}
      url: https://api.openai.com/v1/chat/completions
      api-key: ${LLM_GPT_API_KEY:}
      model: ${LLM_GPT_MODEL:gpt-4.1}
      timeout: 60
      priority: 4

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: starloom-mysql
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: starloom
      MYSQL_USER: ${MYSQL_USER:-starloom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./starloom.sql:/docker-entrypoint-initdb.d/starloom.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - starloom-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: starloom-redis
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - starloom-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  backend:
    image: eclipse-temurin:17-jdk
    container_name: starloom-backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_SITE_URL: https://ibazi.site
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/starloom?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4,collation_connection=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-starloom}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SPRING_DATA_REDIS_DATABASE: 0
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/suanming:/app/deploy:ro
      - /opt/suanming/logs:/app/logs
    working_dir: /app
    command: >
      java
      -Xms512m
      -Xmx1024m
      -XX:+UseG1GC
      -XX:MaxGCPauseMillis=200
      -XX:+HeapDumpOnOutOfMemoryError
      -XX:HeapDumpPath=/app/logs/heapdump.hprof
      -Djava.security.egd=file:/dev/./urandom
      -Dfile.encoding=UTF-8
      -jar /app/deploy/starloom-backend-1.0.0.jar
      --spring.profiles.active=prod
    networks:
      - starloom-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      timeout: 10s
      retries: 5
      start_period: 30s
      interval: 10s

  frontend:
    image: nginx:alpine
    container_name: starloom-frontend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/suanming/dist:/usr/share/nginx/html:ro
      - /opt/suanming/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/suanming/logs/nginx:/var/log/nginx
    environment:
      TZ: Asia/Shanghai
    networks:
      - starloom-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      timeout: 10s
      retries: 5
      start_period: 10s
      interval: 5s

networks:
  starloom-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
